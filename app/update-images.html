  function log(msg, cls = '') {
    const div = document.getElementById('log');
    div.innerHTML += `<div class="${cls}">${msg}</div>`;
    div.scrollTop = div.scrollHeight;
  }

  async function runUpdate() {
    const btn = document.querySelector('button');
    btn.disabled = true;
    btn.textContent = '⏳ Running...';
    document.getElementById('log').innerHTML = '';

    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_KEY);

    log('🔌 Connecting to Supabase...');

    // Fetch all items from DB
    const { data: dbItems, error: fetchErr } = await sb.from('menu_items').select('name, image');
    if (fetchErr) {
      log('❌ Failed to fetch items: ' + fetchErr.message, 'err');
      btn.disabled = false; btn.textContent = '▶ Run Image Update';
      return;
    }

    log(`📋 Found ${dbItems.length} items in Supabase database.`);

    let updated = 0, skipped = 0, errors = 0;

    for (const dbItem of dbItems) {
      const localImg = IMAGE_MAP[dbItem.name];
      if (!localImg) {
        log(`⏭ SKIP — no local image for: <b>${dbItem.name}</b>`, 'skip');
        skipped++;
        continue;
      }

      const { error: updateErr } = await sb
        .from('menu_items')
        .update({ image: localImg })
        .eq('name', dbItem.name);

      if (updateErr) {
        log(`❌ ERROR updating "${dbItem.name}": ${updateErr.message}`, 'err');
        errors++;
      } else {
        log(`✅ Updated: <b>${dbItem.name}</b> → ${localImg}`, 'ok');
        updated++;
      }
    }

    log(`<br>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, 'done');
    log(`✅ Updated: ${updated} &nbsp;|&nbsp; ⏭ Skipped: ${skipped} &nbsp;|&nbsp; ❌ Errors: ${errors}`, 'done');
    log(`🎉 Done! Refresh your menu at <a href="index.html" style="color:#0cf">index.html</a> to see the images.`, 'done');

    btn.disabled = false;
    btn.textContent = '✅ Done — Run Again';
  }
